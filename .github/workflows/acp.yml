name: agent-bus-acp-offline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Copy only standalone ACP folder
        run: python -c "import shutil; shutil.copytree('acp_bridge', '../isolated-acp')"
      - name: Install pinned protocol dependencies and standalone package
        working-directory: ../isolated-acp
        run: python -m pip install .
      - name: Synthetic local ACP tests
        working-directory: ../isolated-acp
        run: python scripts/verify_offline.py
      - name: Installed entry points
        working-directory: ..
        run: |
          mcp-agent-bus-acp --help
          mcp-agent-bus-acp capabilities
